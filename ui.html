<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 12px; color: #1a1a1a; background: #fff;
  padding: 12px 14px;
}
label { display: block; font-size: 11px; font-weight: 500; color: #555; margin-bottom: 3px; }
select, input, textarea {
  width: 100%; padding: 6px 8px; border: 1px solid #ddd;
  border-radius: 5px; font-size: 12px; outline: none; color: #1a1a1a; background: #fff;
}
select:focus, input:focus, textarea:focus { border-color: #18a0fb; }
textarea { resize: none; height: 42px; font-family: inherit; }
.row { margin-bottom: 8px; }
.status {
  padding: 6px 10px; border-radius: 5px; font-size: 11px;
  margin-bottom: 8px; display: none;
}
.info    { background: #e8f4fd; color: #0d6efd; }
.success { background: #d4edda; color: #155724; }
.error   { background: #f8d7da; color: #721c24; }
hr { border: none; border-top: 1px solid #eee; margin: 8px 0; }
.frame-list {
  border: 1px solid #eee; border-radius: 4px; padding: 3px 8px;
  background: #fafafa; max-height: 48px; overflow-y: auto; margin-top: 3px;
}
.frame-item { font-size: 11px; color: #666; line-height: 1.7; }
.frame-item:before { content: "• "; color: #bbb; }
.btn-share {
  width: 100%; padding: 9px; border: none; border-radius: 6px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  background: #18a0fb; color: #fff; margin-top: 8px;
}
.btn-share:hover { background: #0d8de3; }
.btn-share:disabled { background: #aad4f5; cursor: not-allowed; }
.key-badge {
  font-size: 10px; padding: 2px 7px; border-radius: 10px; cursor: pointer;
  white-space: nowrap; border: 1px solid;
}
.key-ok      { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
.key-missing { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
</style>
</head>
<body>

<!-- 헤더 -->
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
  <span style="font-size:13px;font-weight:600">Figma to Slack</span>
  <div style="display:flex;gap:6px;align-items:center">
    <span id="key-badge" class="key-badge key-missing" onclick="toggleKeySetup()" title="파일 키 설정">⚠ 키 없음</span>
    <button onclick="refresh()" id="refresh-btn" title="새로고침"
      style="background:none;border:1px solid #ddd;border-radius:5px;padding:2px 7px;cursor:pointer;font-size:13px;color:#666;line-height:1.4">↺</button>
  </div>
</div>

<!-- 상태 메시지 -->
<div id="status" class="status"></div>

<!-- 파일 키 설정 (키 없을 때 또는 배지 클릭 시 표시) -->
<div id="filekey-setup" style="display:none;background:#fffbeb;border:1px solid #fcd34d;border-radius:6px;padding:8px;margin-bottom:8px">
  <div style="font-size:10px;color:#92400e;margin-bottom:5px">Figma 디자인 파일 URL 붙여넣기 또는 자동 감지</div>
  <div style="display:flex;gap:4px">
    <input type="text" id="file-key-input" placeholder="https://figma.com/design/..." style="flex:1;font-size:11px;padding:5px 7px">
    <button onclick="saveFileKey()"
      style="padding:5px 9px;font-size:11px;background:#18a0fb;color:#fff;border:none;border-radius:4px;cursor:pointer;white-space:nowrap">저장</button>
    <button onclick="tryClipboardDetect(true)" title="클립보드에서 자동 감지"
      style="padding:5px 9px;font-size:11px;background:#fff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:4px;cursor:pointer;white-space:nowrap">📋</button>
  </div>
</div>

<!-- 선택된 항목 -->
<div class="row">
  <label>선택된 항목</label>
  <select id="item-select">
    <option value="">-- 피그마에서 선택해주세요 --</option>
  </select>
</div>

<!-- 프레임 목록 (섹션 선택 시) -->
<div id="frame-preview" style="display:none" class="row">
  <div class="frame-list" id="frame-list"></div>
</div>

<hr>

<!-- 노션 + 채널 (2열) -->
<div style="display:flex;gap:8px" class="row">
  <div style="flex:3">
    <label>📋 노션 항목 <span id="notion-loading" style="font-weight:400;color:#bbb;font-size:10px"></span></label>
    <select id="notion-select" onchange="onNotionSelect()">
      <option value="">-- 해당 없음 --</option>
    </select>
  </div>
  <div style="flex:2">
    <label>슬랙 채널</label>
    <select id="channel-select">
      <option value="C0A8WKD7X19">#1_사업팀_디자인요청</option>
    </select>
  </div>
</div>

<!-- 스레드 URL -->
<div class="row" style="position:relative">
  <input type="text" id="thread-url"
    placeholder="스레드 URL (노션 선택 시 자동 입력)"
    style="padding-right:80px;font-size:11px">
  <span id="notion-thread-status"
    style="position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;white-space:nowrap;color:#059669"></span>
</div>

<!-- 메시지 -->
<div class="row">
  <textarea id="message" placeholder="메시지 (선택)">작업 완료되어 전달드립니다 :듀가나디_장미:</textarea>
</div>

<!-- 공유 버튼 -->
<button class="btn-share" id="share-btn" onclick="share()">슬랙에 공유하기</button>

<script>
var fileUrl = '';
var currentItems = [];
var selectedId = null;
var notionEntries = [];
var storedFileKey = null;
var storedFileName = null;
var keySetupOpen = false;

function toggleKeySetup() {
  keySetupOpen = !keySetupOpen;
  document.getElementById('filekey-setup').style.display = keySetupOpen ? 'block' : 'none';
}

function applyFileKey(key) {
  if (!key || storedFileKey) return;
  var clean = extractFileKey(key);
  if (!clean) return;
  storedFileKey = clean;
  if (storedFileName) {
    fetch('http://127.0.0.1:18790/set-filekey', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fileName: storedFileName, fileKey: clean })
    }).catch(function() {});
  }
  updateKeyBadge();
}

function tryClipboardDetect(showFeedback) {
  if (!navigator.clipboard || !navigator.clipboard.readText) {
    if (showFeedback) showStatus('클립보드 접근 불가. URL을 직접 붙여넣어 주세요.', 'error');
    return;
  }
  navigator.clipboard.readText()
    .then(function(text) {
      var key = extractFileKey(text);
      if (key) {
        storedFileKey = key;
        if (storedFileName) {
          fetch('http://127.0.0.1:18790/set-filekey', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fileName: storedFileName, fileKey: key })
          }).catch(function() {});
        }
        updateKeyBadge();
        if (showFeedback) showStatus('✅ 파일 키 감지 완료! 다음부터 자동으로 불러와요.', 'success');
      } else {
        if (showFeedback) showStatus('클립보드에 Figma URL이 없어요. 브라우저에서 URL 복사 후 다시 시도해주세요.', 'error');
      }
    })
    .catch(function() {
      if (showFeedback) showStatus('클립보드 접근이 거부됐어요. URL을 직접 붙여넣어 주세요.', 'error');
    });
}

function loadFilekeyFromServer(fileName) {
  fetch('http://127.0.0.1:18790/get-filekey?fileName=' + encodeURIComponent(fileName))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.fileKey) {
        applyFileKey(d.fileKey);
      } else {
        updateKeyBadge();
        tryClipboardDetect(false);
      }
    })
    .catch(function() { updateKeyBadge(); });
}

function extractFileKey(val) {
  if (!val) return null;
  var m = val.match(/figma\.com\/(?:file|design)\/([a-zA-Z0-9]{10,40})/);
  if (m) return m[1];
  var k = val.split(/[/?&# ]/)[0];
  return /^[a-zA-Z0-9]{10,40}$/.test(k) ? k : null;
}

function updateKeyBadge() {
  var badge = document.getElementById('key-badge');
  var setup = document.getElementById('filekey-setup');
  // fileUrl은 항상 기본 URL만 — node-id는 code.js가 linkNodeId로 처리
  fileUrl = storedFileKey ? 'https://www.figma.com/design/' + storedFileKey : '';
  if (storedFileKey) {
    badge.textContent = '🟢 ' + storedFileKey.substring(0, 6) + '…';
    badge.className = 'key-badge key-ok';
    if (!keySetupOpen) setup.style.display = 'none';
  } else {
    badge.textContent = '⚠ 키 없음';
    badge.className = 'key-badge key-missing';
    setup.style.display = 'block';
    keySetupOpen = true;
  }
}

function saveFileKey() {
  var raw = document.getElementById('file-key-input').value.trim();
  var key = extractFileKey(raw);
  if (!key) {
    showStatus('올바른 Figma 디자인 파일 URL을 붙여넣어 주세요. (figma.com/design/... 형식)', 'error');
    return;
  }
  storedFileKey = key;
  if (storedFileName) {
    fetch('http://127.0.0.1:18790/set-filekey', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fileName: storedFileName, fileKey: key })
    }).catch(function() {});
  }
  parent.postMessage({ pluginMessage: { type: 'save-filekey', fileKey: key } }, '*');
  document.getElementById('file-key-input').value = key;
  keySetupOpen = false;
  updateKeyBadge();
  showStatus('파일 키 저장 완료!', 'success');
}

var selectedNotionId = null;

function loadNotionEntries() {
  fetch('http://127.0.0.1:18790/notion-entries')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      document.getElementById('notion-loading').textContent = '';
      if (!data.ok) return;
      notionEntries = data.entries || [];
      var sel = document.getElementById('notion-select');
      sel.innerHTML = '<option value="">-- 해당 없음 --</option>';
      notionEntries.forEach(function(e) {
        var opt = document.createElement('option');
        opt.value = e.id;
        var meta = [e.team, e.deadline ? '마감 ' + e.deadline : ''].filter(Boolean).join(' · ');
        opt.textContent = e.title + (meta ? ' (' + meta + ')' : '');
        sel.appendChild(opt);
      });
    })
    .catch(function() {
      document.getElementById('notion-loading').textContent = '(서버 미실행)';
    });
}

function onNotionSelect() {
  selectedNotionId = document.getElementById('notion-select').value || null;
  var statusEl = document.getElementById('notion-thread-status');
  if (!selectedNotionId) {
    statusEl.textContent = '';
    document.getElementById('thread-url').value = '';
    return;
  }
  statusEl.textContent = '🔍 검색 중…';
  statusEl.style.color = '#aaa';
  document.getElementById('thread-url').value = '';

  fetch('http://127.0.0.1:18790/find-thread?pageId=' + encodeURIComponent(selectedNotionId))
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.threadUrl) {
        document.getElementById('thread-url').value = data.threadUrl;
        statusEl.textContent = '✅ 자동 입력';
        statusEl.style.color = '#059669';
        document.getElementById('broadcast-row').style.display = 'block';
      } else {
        statusEl.textContent = '⚠ 스레드 없음';
        statusEl.style.color = '#d97706';
        document.getElementById('broadcast-row').style.display = 'none';
      }
    })
    .catch(function() { statusEl.textContent = '검색 실패'; });
}

function loadChannels() {
  fetch('http://127.0.0.1:18790/channels')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (!data.ok) throw new Error(data.error);
      var sel = document.getElementById('channel-select');
      sel.innerHTML = '';
      data.channels.forEach(function(ch) {
        var opt = document.createElement('option');
        opt.value = ch.id;
        opt.textContent = '#' + ch.name;
        if (ch.id === 'C0A8WKD7X19') opt.selected = true;
        sel.appendChild(opt);
      });
    });
}

function refresh() {
  var btn = document.getElementById('refresh-btn');
  btn.textContent = '↻'; btn.style.color = '#18a0fb';
  loadNotionEntries();
  parent.postMessage({ pluginMessage: { type: 'get-selection' } }, '*');
  setTimeout(function() { btn.textContent = '↺'; btn.style.color = '#666'; }, 800);
}

loadChannels();
loadNotionEntries();

window.onmessage = function(event) {
  var msg = event.data.pluginMessage;
  if (!msg) return;

  if (msg.type === 'stored-filekey') {
    storedFileName = msg.fileName || null;
    if (msg.fileKey && !storedFileKey) applyFileKey(msg.fileKey);
    if (storedFileName && !storedFileKey) loadFilekeyFromServer(storedFileName);
    if (!storedFileKey) updateKeyBadge();
  }

  if (msg.type === 'no-selection') {
    currentItems = [];
    updateItemSelect();
    showStatus('피그마에서 프레임이나 섹션을 선택해주세요', 'info');
    return;
  }

  if (msg.type === 'selection') {
    if (msg.fileKey) applyFileKey(msg.fileKey);
    currentItems = [];
    (msg.sections || []).forEach(function(sec) {
      currentItems.push({ id: sec.id, name: sec.name, type: 'section', children: sec.children });
    });
    (msg.frames || []).forEach(function(frame) {
      currentItems.push({ id: frame.id, name: frame.name, type: 'frame' });
    });
    updateItemSelect();
    if (currentItems.length > 0) {
      showStatus((msg.sections.length + msg.frames.length) + '개 항목 선택됨', 'info');
    }
  }

  if (msg.type === 'export-done') uploadToSlack(msg.frames, msg.nodeUrl, msg.displayName, msg.threadUrl);
  if (msg.type === 'error') { showStatus(msg.message, 'error'); setLoading(false); }
};

function updateItemSelect() {
  var sel = document.getElementById('item-select');
  sel.innerHTML = '<option value="">-- 선택해주세요 --</option>';
  currentItems.forEach(function(item) {
    var opt = document.createElement('option');
    opt.value = item.id;
    opt.textContent = item.type === 'section'
      ? '📦 ' + item.name + ' (' + item.children.length + '개)'
      : '🖼️ ' + item.name;
    sel.appendChild(opt);
  });
  if (currentItems.length > 0) {
    sel.value = currentItems[0].id;
    selectedId = currentItems[0].id;
    updateFramePreview();
    updateKeyBadge();
  } else {
    document.getElementById('frame-preview').style.display = 'none';
  }
}


document.getElementById('item-select').onchange = function() {
  selectedId = this.value;
  updateFramePreview();
  updateKeyBadge();
};

function updateFramePreview() {
  var item = currentItems.find(function(i) { return i.id === selectedId; });
  var preview = document.getElementById('frame-preview');
  var list = document.getElementById('frame-list');
  if (item && item.type === 'section') {
    list.innerHTML = item.children.map(function(c) {
      return '<div class="frame-item">' + c.name + '</div>';
    }).join('');
    preview.style.display = 'block';
  } else {
    preview.style.display = 'none';
  }
}

function showStatus(msg, type) {
  var el = document.getElementById('status');
  el.style.display = 'block';
  el.className = 'status ' + type;
  el.textContent = msg;
}

function setLoading(loading) {
  var btn = document.getElementById('share-btn');
  btn.disabled = loading;
  btn.textContent = loading ? '공유 중...' : '슬랙에 공유하기';
}

function share() {
  if (!selectedId) { showStatus('공유할 항목을 선택해주세요', 'error'); return; }
  var item = currentItems.find(function(i) { return i.id === selectedId; });
  if (!item) { showStatus('선택된 항목을 찾을 수 없습니다', 'error'); return; }
  if (!fileUrl) { showStatus('파일 키를 먼저 설정해주세요 (상단 ⚠ 키 없음 클릭)', 'error'); return; }

  setLoading(true);
  var threadUrl = document.getElementById('thread-url').value.trim();
  var nodeIds = item.type === 'section'
    ? item.children.map(function(c) { return c.id; })
    : [selectedId];
  showStatus('프레임 추출 중' + (nodeIds.length > 1 ? ' (' + nodeIds.length + '개)...' : '...'), 'info');

  function doExport(linkId) {
    parent.postMessage({ pluginMessage: {
      type: 'export-frames', nodeIds: nodeIds, linkNodeId: linkId,
      fileUrl: fileUrl, displayName: item.name, threadUrl: threadUrl
    } }, '*');
  }

  if (storedFileKey && selectedId) {
    fetch('http://127.0.0.1:18790/figma-node-url', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fileKey: storedFileKey, nodeId: selectedId })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) { doExport(d.ok ? d.nodeId : selectedId); })
    .catch(function() { doExport(selectedId); });
  } else {
    doExport(selectedId);
  }
}

function uploadToSlack(frames, nodeUrl, displayName, threadUrl) {
  var channelId = document.getElementById('channel-select').value;
  var message = document.getElementById('message').value.trim();
  showStatus('슬랙에 업로드 중...', 'info');

  var uploadData = {
    frames: frames.map(function(f) {
      var binary = '';
      var uint8 = new Uint8Array(f.bytes);
      for (var j = 0; j < uint8.length; j++) binary += String.fromCharCode(uint8[j]);
      return { imageBase64: btoa(binary), filename: f.name.replace(/[^a-zA-Z0-9_-]/g, '_') + '.png', nodeId: f.nodeId };
    }),
    channelId: channelId, message: message,
    figmaUrl: nodeUrl, frameName: displayName, threadUrl: threadUrl
  };

  fetch('http://127.0.0.1:18790/share', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(uploadData)
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    if (!data.ok) throw new Error(data.error);
    showStatus('✅ "' + displayName + '" 공유 완료!', 'success');
    document.getElementById('message').value = '작업 완료되어 전달드립니다 :듀가나디_장미:';
    if (selectedNotionId && nodeUrl) {
      var nodeIds = frames.map(function(f) { return f.nodeId; });
      fetch('http://127.0.0.1:18790/notion-complete', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pageId: selectedNotionId, figmaUrl: nodeUrl, fileKey: storedFileKey || null, nodeIds: nodeIds })
      })
      .then(function(r) { return r.json(); })
      .then(function(r) { if (r.ok) showStatus('✅ "' + displayName + '" 공유 + 노션 완료 처리!', 'success'); });
    }
  })
  .catch(function(err) { showStatus('오류: ' + err.message, 'error'); })
  .finally(function() { setLoading(false); });
}
</script>
</body>
</html>
